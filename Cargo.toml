[workspace]
resolver = "3"
members = ["crates/bench", "crates/carddata", "crates/diff", "crates/engine", "crates/ocgcore-sys", "crates/oracle", "crates/py", "crates/scripts", "crates/sim"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# Debug builds of the C++ core are too slow for the random-duel tests.
[profile.dev.package.ocgcore-sys]
opt-level = 3

[profile.sim]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

# The sim profile for the Python module: pyo3 raises a panic as an exception, which needs unwinding.
[profile.python]
inherits = "sim"
panic = "unwind"

[profile.card]
inherits = "release"
incremental = true
codegen-units = 256
lto = "off"
