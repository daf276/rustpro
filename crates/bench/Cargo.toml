[package]
name = "bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
default-run = "bench"

[dependencies]
carddata = { path = "../carddata" }
engine = { path = "../engine" }
fiber = { path = "../fiber" }
mimalloc = { version = "0.1", default-features = false }
oracle = { path = "../oracle" }
rand = { version = "0.9", default-features = false, features = ["alloc", "std_rng"] }
rayon = { version = "1", default-features = false }
scripts = { path = "../scripts" }
sim = { path = "../sim" }

[features]
ocg = ["carddata/ocg"]
# The benches on the system heap instead of mimalloc.
system-allocator = []

[lints]
workspace = true
