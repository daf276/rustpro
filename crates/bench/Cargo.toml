[package]
name = "bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
default-run = "bench"

[dependencies]
carddata = { path = "../carddata" }
diff = { path = "../diff" }
engine = { path = "../engine" }
mimalloc = { version = "0.1", default-features = false, optional = true }
oracle = { path = "../oracle" }
rand = { version = "0.9", default-features = false, features = ["alloc", "std_rng"] }
rayon = { version = "1", default-features = false }
scripts = { path = "../scripts" }
sim = { path = "../sim" }

[features]
# The stack bench on mimalloc instead of the system heap.
mimalloc = ["dep:mimalloc"]
# The engine's fast mode (crates/engine/Cargo.toml), for the divergence binary and the benches.
fast = ["engine/fast"]

[lints]
workspace = true
