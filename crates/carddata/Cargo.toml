[package]
name = "carddata"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["cdb"]
# Reading cards.cdb compiles SQLite; the engine only needs the data types.
cdb = ["dep:rusqlite"]
# The pool also holds the OCG-only cards (still under the TCG banlist).
ocg = []

[dependencies]
rusqlite = { version = "0.40", default-features = false, features = ["bundled"], optional = true }
rand = { version = "0.9", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }

[lints]
workspace = true
