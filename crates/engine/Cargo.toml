[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
carddata = { path = "../carddata", default-features = false }
# Positions and duel records as compact bytes; alloc only, for Vec.
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
scripts = { path = "../scripts" }

[features]
# The same rules with the cheap tests first and the conditions they decide skipped, so effect timestamps no longer
# follow EDOPro's; the bench's divergence binary measures how often a duel then plays out differently.
fast = []

[lints]
workspace = true
